name: alma-leads

x-api-env: &api-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # Upstream stopped publishing minio/minio images; pgsty/minio is a maintained drop-in build.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  # One-shot gate: applies Prisma migrations, then exits 0. `api` waits for it.
  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: ./apps/api
    env_file: .env
    environment:
      <<: *api-env
      # Trust X-Forwarded-For only from the NextJS proxy (pinned address below).
      FORWARDED_ALLOW_IPS: 172.28.0.10
    # Seed demo attorneys (idempotent), then serve.
    command: ["sh", "-c", "python -m app.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"]
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      default:

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000   # baked into the /api rewrite at `next build`
    environment:
      API_INTERNAL_URL: http://api:8000
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    networks:
      default:
        ipv4_address: 172.28.0.10

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  miniodata:
