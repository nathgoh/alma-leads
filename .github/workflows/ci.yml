name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: alma-leads

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: alma_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alma_test
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: alma-leads/apps/api/uv.lock
      - run: uv sync --locked
        working-directory: alma-leads/apps/api
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy app
        working-directory: alma-leads/apps/api
      # Includes the OpenAPI contract test: fails if the web client wasn't regenerated.
      - run: uv run pytest
        working-directory: alma-leads/apps/api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alma-leads/apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: alma-leads/apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated client is up to date with openapi.json
        run: pnpm generate:api && git diff --exit-code src/lib/api/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  db-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alma_ci
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alma_ci_shadow
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alma-leads/apps/api/package-lock.json
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: alma-leads/apps/api/uv.lock
      - run: npm ci
        working-directory: alma-leads/apps/api
      - run: uv sync --locked
        working-directory: alma-leads/apps/api
      - run: >-
          psql postgresql://postgres:postgres@localhost:5432/postgres
          -c 'CREATE DATABASE alma_ci' -c 'CREATE DATABASE alma_ci_shadow'
      - run: scripts/db-check.sh
