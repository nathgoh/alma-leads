[project]
name = "alma-leads-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "pydantic[email]",    # EmailStr
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "pwdlib[argon2]",
    "pyjwt",
    "python-multipart",   # FastAPI multipart parsing (resume upload)
    "python-magic",       # content sniffing; needs libmagic1 in the image
    "boto3",
    "slowapi",
    "jinja2",
    "aiosmtplib",
    "resend",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "alembic",            # test-only: compare_metadata in the drift test, never runs migrations
    "ruff",
    "mypy",
    "boto3-stubs[s3]",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["slowapi.*", "magic.*", "resend.*"]
ignore_missing_imports = true
