{% extends "_layout.html" %}
{% block body %}
<p style="margin:0 0 16px;">A new lead was submitted.</p>
<table role="presentation" cellpadding="6" cellspacing="0" style="font-size:14px;border-collapse:collapse;margin-bottom:20px;">
  <tr><td style="color:#71717a;">Name</td><td>{{ lead.first_name }} {{ lead.last_name }}</td></tr>
  <tr><td style="color:#71717a;">Email</td><td>{{ lead.email }}</td></tr>
  <tr><td style="color:#71717a;">Resume</td><td>{{ lead.resume_name }} ({{ resume_size_kb }} KB)</td></tr>
  <tr><td style="color:#71717a;">Submitted</td><td>{{ submitted_at }}</td></tr>
</table>
<a href="{{ lead_url }}" style="display:inline-block;background:#18181b;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:6px;font-size:14px;">Open lead</a>
{% endblock %}
